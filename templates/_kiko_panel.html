{# Always-on Kiko assistant panel. Wired in Phase 2 (chat + tool-calling). #}
<aside class="kiko glass" aria-label="Kiko assistant">
  <div class="kiko-head">
    <span class="kiko-orb">{{ icon('mic', 20) }}</span>
    <div class="kiko-title">
      <strong>Kiko Bot</strong>
      <small>AI Assistant</small>
    </div>
    <button class="icon-btn" id="kiko-new" type="button" aria-label="New chat" title="New chat">
      {{ icon('plus', 18) }}
    </button>
  </div>
  <div class="kiko-body" id="kiko-messages" aria-live="polite"></div>
  <form class="kiko-input" id="kiko-form">
    <input type="text" id="kiko-text" placeholder="Ask Kiko…" autocomplete="off">
    <button class="icon-btn" type="submit" aria-label="Send">{{ icon('chevron-right', 18) }}</button>
  </form>
</aside>
