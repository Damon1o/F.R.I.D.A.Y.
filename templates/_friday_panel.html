{# Always-on F.R.I.D.A.Y. assistant panel. Wired in Phase 2 (chat + tool-calling). #}
<aside class="friday glass" aria-label="F.R.I.D.A.Y. assistant">
  <div class="friday-head">
    <span class="friday-orb">{{ icon('mic', 20) }}</span>
    <div class="friday-title">
      <strong>F.R.I.D.A.Y.</strong>
      <small>AI Assistant</small>
    </div>
    <button class="icon-btn" id="friday-new" type="button" aria-label="New chat" title="New chat">
      {{ icon('plus', 18) }}
    </button>
  </div>
  <div class="friday-body" id="friday-messages" aria-live="polite"></div>
  <form class="friday-input" id="friday-form">
    <input type="text" id="friday-text" placeholder="Ask F.R.I.D.A.Y.…" autocomplete="off">
    <button class="icon-btn" id="friday-voice" type="button" hidden aria-label="Hold to talk" title="Talk">{{ icon('mic', 18) }}</button>
    <button class="icon-btn" type="submit" aria-label="Send">{{ icon('chevron-right', 18) }}</button>
  </form>
</aside>
